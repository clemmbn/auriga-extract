[project]
name = "auriga-extract"
version = "0.1.0"
description = "Export ISAE-SUPAERO timetable courses from Auriga as a combined .ics file"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "icalendar>=7.3.0",
    "rich>=15.0.0",
]

[project.scripts]
auriga-extract = "auriga_extract.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
